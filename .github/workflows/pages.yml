# Builds the page and publishes it to GitHub Pages (free) on every push to main.
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Base map tiles (OpenStreetMap via Protomaps)
        run: |
          pip install pmtiles requests
          python scripts/cybercab/tiles.py
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/cybercab/package-lock.json
      - run: npm ci
        working-directory: apps/cybercab
      - run: npm test
        working-directory: apps/cybercab
      - run: npm run build
        working-directory: apps/cybercab
        env:
          CYBERCAB_BASE: /cybercab-sim/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/cybercab/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
